<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>MELS EPIC CROSSWORDS !!</title>
  <link rel="icon" type="image/jpeg" href="https://i.pinimg.com/564x/e4/60/d8/e460d8a68e2fa32a7aa2b86aae4229bd.jpg">

  <style>
    :root {
      --primary-color: #4a90e2;
      --highlight-color: #a4c2f4;
      --cell-highlight: #d9e1f2;
      --border-color: #222;
      --correct-color: #2e7d32;
      --correct-bg: #e8f5e9;
      --wrong-color: #c62828;
      --wrong-bg: #ffebee;
      --grid-size: 5;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #f8f9fa;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 5px 0;
      font-size: 2rem;
      letter-spacing: -1px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
    }

    select {
      padding: 6px 12px;
      font-size: 1rem;
      border-radius: 4px;
      border: 1px solid #ccc;
      background-color: white;
      cursor: pointer;
    }

    .timer {
      font-size: 1.2rem;
      font-weight: bold;
      color: #666;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 800px;
      width: 100%;
    }

    @media (min-width: 600px) {
      .main-container {
        flex-direction: row;
        align-items: flex-start;
        justify-content: center;
      }
    }

    /* Grid Styling */
    .grid {
      display: grid;
      grid-template-columns: repeat(var(--grid-size), 50px);
      grid-template-rows: repeat(var(--grid-size), 50px);
      gap: 2px;
      background-color: var(--border-color);
      border: 3px solid var(--border-color);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      border-radius: 4px;
    }

    .cell {
      background-color: white;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      text-transform: uppercase;
      user-select: none;
      cursor: pointer;
      overflow: hidden;
      transition: background-color 0.15s ease;
    }

    /* Non-typable / Black Cell GIF Styling */
    .cell.black {
      background-color: #000;
      cursor: default;
    }

    .cell.black img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .cell.highlighted {
      background-color: var(--cell-highlight);
    }

    .cell.active {
      background-color: var(--highlight-color);
    }

    /* Feedback States */
    .cell.correct {
      background-color: var(--correct-bg) !important;
      color: var(--correct-color);
    }

    .cell.correct::after {
      content: '✓';
      position: absolute;
      bottom: 2px;
      right: 3px;
      font-size: 0.65rem;
      color: var(--correct-color);
    }

    .cell.incorrect {
      background-color: var(--wrong-bg) !important;
      color: var(--wrong-color);
      text-decoration: line-through;
    }

    .cell-number {
      position: absolute;
      top: 2px;
      left: 3px;
      font-size: 0.65rem;
      font-weight: normal;
      color: #555;
    }

    .clues-container {
      display: flex;
      gap: 20px;
      flex: 1;
      width: 100%;
    }

    .clue-column {
      flex: 1;
    }

    .clue-column h3 {
      border-bottom: 2px solid #ccc;
      padding-bottom: 5px;
      margin-top: 0;
    }

    .clue-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .clue-item {
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }

    .clue-item.active {
      background-color: var(--cell-highlight);
      font-weight: bold;
    }

    /* Footer GIF Styling */
    .footer-gif {
      margin-top: 20px;
      text-align: center;
    }

    .footer-gif img {
      max-width: 250px;
      border-radius: 8px;
    }

    /* Controls & Dropdown Menu */
    .controls {
      margin-top: 15px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      position: relative;
    }

    button {
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      background-color: var(--primary-color);
      color: white;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #357abd;
    }

    .btn-hint {
      background-color: #f39c12;
    }

    .btn-hint:hover {
      background-color: #d68910;
    }

    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      bottom: 100%;
      left: 0;
      background-color: white;
      min-width: 140px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 5px;
      z-index: 10;
    }

    .dropdown-content.show {
      display: block;
    }

    .dropdown-content button {
      color: #333;
      padding: 10px 14px;
      text-decoration: none;
      display: block;
      width: 100%;
      text-align: left;
      background-color: white;
      border-radius: 0;
      border-bottom: 1px solid #eee;
    }

    .dropdown-content button:hover {
      background-color: #f1f1f1;
    }
  </style>
</head>

    <h1>MELS EPIC CROSSWORDS !!</h1>

    </div>

    <button id="reset-btn">Reset</button>
  </div>
