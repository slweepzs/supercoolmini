<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Crossword Web App</title>
  <style>
    :root {
      --primary-color: #4a90e2;
      --highlight-color: #a4c2f4;
      --cell-highlight: #d9e1f2;
      --border-color: #222;
      --black-square-bg: #1e242b;
      --correct-color: #2e7d32;
      --correct-bg: #e8f5e9;
      --wrong-color: #c62828;
      --wrong-bg: #ffebee;
      --grid-size: 5;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #f8f9fa;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 5px 0;
      font-size: 2rem;
      letter-spacing: -1px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
    }

    select {
      padding: 6px 12px;
      font-size: 1rem;
      border-radius: 4px;
      border: 1px solid #ccc;
      background-color: white;
      cursor: pointer;
    }

    .timer {
      font-size: 1.2rem;
      font-weight: bold;
      color: #666;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 800px;
      width: 100%;
    }

    @media (min-width: 600px) {
      .main-container {
        flex-direction: row;
        align-items: flex-start;
        justify-content: center;
      }
    }

    /* Grid Styling */
    .grid {
      display: grid;
      grid-template-columns: repeat(var(--grid-size), 50px);
      grid-template-rows: repeat(var(--grid-size), 50px);
      gap: 2px;
      background-color: var(--border-color);
      border: 3px solid var(--border-color);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      border-radius: 4px;
    }

    .cell {
      background-color: white;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      text-transform: uppercase;
      user-select: none;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    /* High Visibility Black Squares */
    .cell.black {
      background-color: var(--black-square-bg);
      background-image: linear-gradient(135deg, #111418 25%, transparent 25%, transparent 50%, #111418 50%, #111418 75%, transparent 75%, transparent);
      background-size: 8px 8px;
      border: 1px solid #111;
      cursor: default;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
    }

    .cell.highlighted {
      background-color: var(--cell-highlight);
    }

    .cell.active {
      background-color: var(--highlight-color);
    }

    /* Checking Feedback States */
    .cell.correct {
      background-color: var(--correct-bg) !important;
      color: var(--correct-color);
    }

    .cell.correct::after {
      content: '✓';
      position: absolute;
      bottom: 2px;
      right: 3px;
      font-size: 0.65rem;
      color: var(--correct-color);
    }

    .cell.incorrect {
      background-color: var(--wrong-bg) !important;
      color: var(--wrong-color);
      text-decoration: line-through;
    }

    .cell-number {
      position: absolute;
      top: 2px;
      left: 3px;
      font-size: 0.65rem;
      font-weight: normal;
      color: #555;
    }

    .clues-container {
      display: flex;
      gap: 20px;
      flex: 1;
      width: 100%;
    }

    .clue-column {
      flex: 1;
    }

    .clue-column h3 {
      border-bottom: 2px solid #ccc;
      padding-bottom: 5px;
      margin-top: 0;
    }

    .clue-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .clue-item {
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }

    .clue-item.active {
      background-color: var(--cell-highlight);
      font-weight: bold;
    }

    /* Controls & Dropdown Menu */
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      position: relative;
    }

    button {
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      background-color: var(--primary-color);
      color: white;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #357abd;
    }

    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      bottom: 100%;
      left: 0;
      background-color: white;
      min-width: 140px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 5px;
      z-index: 10;
    }

    .dropdown-content button {
      color: #333;
      padding: 10px 14px;
      text-decoration: none;
      display: block;
      width: 100%;
      text-align: left;
      background-color: white;
      border-radius: 0;
      border-bottom: 1px solid #eee;
    }

    .dropdown-content button:hover {
      background-color: #f1f1f1;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <h1>The Mini Crossword</h1>
    <div class="header-controls">
      <select id="puzzle-select"></select>
      <div class="timer" id="timer">00:00</div>
    </div>
  </header>

  <div class="main-container">
    <div class="grid" id="grid"></div>

    <div class="clues-container">
      <div class="clue-column">
        <h3>ACROSS</h3>
        <ul class="clue-list" id="across-clues"></ul>
      </div>
      <div class="clue-column">
        <h3>DOWN</h3>
        <ul class="clue-list" id="down-clues"></ul>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="dropdown">
      <button>Check ▼</button>
      <div class="dropdown-content">
        <button id="check-square-btn">Check Square</button>
        <button id="check-word-btn">Check Word</button>
        <button id="check-puzzle-btn">Check Puzzle</button>
      </div>
    </div>
    <button id="reset-btn">Reset</button>
  </div>

  <script>
    const puzzles = [
      {
        id: "p1",
        title: "Puzzle #1: Animal Kingdom",
        size: 5,
        solution: [
          ['C', 'A', 'T', 'S', null],
          ['A', 'L', 'O', 'E', 'S'],
          ['P', 'I', 'A', 'N', 'O'],
          ['E', 'O', 'S', 'I', 'N'],
          [null, 'N', 'T', 'O', 'P']
        ],
        clues: {
          across: [
            { number: 1, row: 0, col: 0, text: "Feline pets" },
            { number: 5, row: 1, col: 0, text: "Soothing succulents" },
            { number: 6, row: 2, col: 0, text: "Grand instrument" },
            { number: 7, row: 3, col: 0, text: "Red dye used in biology" },
            { number: 8, row: 4, col: 1, text: "On ___ of (in addition to)" }
          ],
          down: [
            { number: 1, row: 0, col: 0, text: "Superhero accessory" },
            { number: 2, row: 0, col: 1, text: "Alias indicator" },
            { number: 3, row: 0, col: 2, text: "Toast topping" },
            { number: 4, row: 0, col: 3, text: "Senorita's title (abbr.)" },
            { number: 5, row: 1, col: 4, text: "Son of Isaac in Genesis" }
          ]
        }
      },
      {
        id: "p2",
        title: "Puzzle #2: Quick Mix",
        size: 5,
        solution: [
          ['F', 'L', 'A', 'G', null],
          ['A', 'L', 'E', 'X', 'A'],
          ['B', 'O', 'G', 'E', 'Y'],
          ['B', 'O', 'I', 'L', null],
          [null, 'A', 'R', 'T', null]
        ],
        clues: {
          across: [
            { number: 1, row: 0, col: 0, text: "The Stars and Stripes, e.g." },
            { number: 5, row: 1, col: 0, text: "Wake word for an Amazon device" },
            { number: 6, row: 2, col: 0, text: "+1 score in golf" },
            { number: 7, row: 3, col: 0, text: "Prepare water for pasta" },
            { number: 8, row: 4, col: 1, text: "Some wall decorations" }
          ],
          down: [
            { number: 1, row: 0, col: 0, text: "Elevator selection" },
            { number: 2, row: 0, col: 1, text: "Not phony, informally" },
            { number: 3, row: 0, col: 2, text: "Figure skating jump" },
            { number: 4, row: 0, col: 3, text: "Gel or paste for hair" },
            { number: 5, row: 1, col: 4, text: "'Dancing Queen' band" }
          ]
        }
      },
      {
        id: "p3",
        title: "Puzzle #3: Easy Breezy",
        size: 5,
        solution: [
          ['S', 'T', 'A', 'R', 'S'],
          ['C', 'O', 'C', 'O', 'A'],
          ['A', 'T', 'O', 'M', 'S'],
          ['M', 'A', 'R', 'C', 'H'],
          ['P', 'L', 'E', 'A', 'D']
        ],
        clues: {
          across: [
            { number: 1, row: 0, col: 0, text: "Night sky sparkles" },
            { number: 5, row: 1, col: 0, text: "Hot chocolate drink" },
            { number: 6, row: 2, col: 0, text: "Tiny building blocks of matter" },
            { number: 7, row: 3, col: 0, text: "Third month of the year" },
            { number: 8, row: 4, col: 0, text: "Beg earnestly in court" }
          ],
          down: [
            { number: 1, row: 0, col: 0, text: "Dishonest scheme" },
            { number: 2, row: 0, col: 1, text: "Total sum" },
            { number: 3, row: 0, col: 2, text: "Acorn producer tree" },
            { number: 4, row: 0, col: 3, text: "Rome's country" },
            { number: 5, row: 0, col: 4, text: "Sash worn with a kimono" }
          ]
        }
      }
    ];

    let currentPuzzle = puzzles[0];
    let activeRow = 0;
    let activeCol = 0;
    let direction = 'across';
    let secondsElapsed = 0;
    let timerInterval = null;
    let userGrid = [];
    let checkStates = []; // Stores 'correct', 'incorrect', or null for each cell

    const gridElement = document.getElementById('grid');
    const acrossCluesElement = document.getElementById('across-clues');
    const downCluesElement = document.getElementById('down-clues');
    const timerElement = document.getElementById('timer');
    const puzzleSelect = document.getElementById('puzzle-select');

    function initPuzzleSelect() {
      puzzleSelect.innerHTML = '';
      puzzles.forEach((p, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = p.title;
        puzzleSelect.appendChild(option);
      });

      puzzleSelect.addEventListener('change', (e) => {
        loadPuzzle(puzzles[e.target.value]);
      });
    }

    function loadPuzzle(puzzle) {
      currentPuzzle = puzzle;
      userGrid = Array(puzzle.size).fill(null).map(() => Array(puzzle.size).fill(''));
      checkStates = Array(puzzle.size).fill(null).map(() => Array(puzzle.size).fill(null));
      
      clearInterval(timerInterval);
      secondsElapsed = 0;
      timerElement.textContent = "00:00";
      startTimer();

      activeRow = 0;
      activeCol = 0;
      while (currentPuzzle.solution[activeRow][activeCol] === null) {
        activeCol++;
        if (activeCol >= currentPuzzle.size) {
          activeCol = 0;
          activeRow++;
        }
      }
      direction = 'across';

      createBoard();
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        timerElement.textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function createBoard() {
      gridElement.innerHTML = '';
      
      let currentNumber = 1;
      const cellNumbers = Array(currentPuzzle.size).fill(null).map(() => Array(currentPuzzle.size).fill(null));

      for (let r = 0; r < currentPuzzle.size; r++) {
        for (let c = 0; c < currentPuzzle.size; c++) {
          if (currentPuzzle.solution[r][c] === null) continue;

          const isAcrossStart = (c === 0 || currentPuzzle.solution[r][c - 1] === null) && 
                                (c + 1 < currentPuzzle.size && currentPuzzle.solution[r][c + 1] !== null);
          const isDownStart = (r === 0 || currentPuzzle.solution[r - 1][c] === null) && 
                              (r + 1 < currentPuzzle.size && currentPuzzle.solution[r + 1][c] !== null);

          if (isAcrossStart || isDownStart) {
            cellNumbers[r][c] = currentNumber++;
          }
        }
      }

      for (let r = 0; r < currentPuzzle.size; r++) {
        for (let c = 0; c < currentPuzzle.size; c++) {
          const cellDiv = document.createElement('div');
          cellDiv.classList.add('cell');
          cellDiv.dataset.row = r;
          cellDiv.dataset.col = c;

          if (currentPuzzle.solution[r][c] === null) {
            cellDiv.classList.add('black');
          } else {
            if (cellNumbers[r][c]) {
              const numSpan = document.createElement('span');
              numSpan.classList.add('cell-number');
              numSpan.textContent = cellNumbers[r][c];
              cellDiv.appendChild(numSpan);
            }

            const letterSpan = document.createElement('span');
            letterSpan.classList.add('letter');
            cellDiv.appendChild(letterSpan);

            cellDiv.addEventListener('click', () => onCellClick(r, c));
          }

          gridElement.appendChild(cellDiv);
        }
      }

      renderClues();
      updateHighlighting();
    }

    function renderClues() {
      const renderList = (clues, element, dir) => {
        element.innerHTML = '';
        clues.forEach(clue => {
          const li = document.createElement('li');
          li.classList.add('clue-item');
          li.dataset.dir = dir;
          li.dataset.num = clue.number;
          li.innerHTML = `<strong>${clue.number}.</strong> ${clue.text}`;
          li.addEventListener('click', () => {
            activeRow = clue.row;
            activeCol = clue.col;
            direction = dir;
            updateHighlighting();
          });
          element.appendChild(li);
        });
      };

      renderList(currentPuzzle.clues.across, acrossCluesElement, 'across');
      renderList(currentPuzzle.clues.down, downCluesElement, 'down');
    }

    function onCellClick(r, c) {
      if (activeRow === r && activeCol === c) {
        direction = direction === 'across' ? 'down' : 'across';
      } else {
        activeRow = r;
        activeCol = c;
      }
      updateHighlighting();
    }

    function updateHighlighting() {
      const cells = document.querySelectorAll('.cell');
      cells.forEach(cell => {
        cell.classList.remove('active', 'highlighted', 'correct', 'incorrect');
        const r = parseInt(cell.dataset.row);
        const c = parseInt(cell.dataset.col);

        if (checkStates[r] && checkStates[r][c]) {
          cell.classList.add(checkStates[r][c]);
        }

        if (r === activeRow && c === activeCol) {
          cell.classList.add('active');
        } else if (belongsToActiveWord(r, c)) {
          cell.classList.add('highlighted');
        }
      });

      document.querySelectorAll('.clue-item').forEach(item => {
        item.classList.remove('active');
      });
      
      const currentClue = getCurrentClue();
      if (currentClue) {
        const activeClueEl = document.querySelector(`.clue-item[data-dir="${direction}"][data-num="${currentClue.number}"]`);
        if (activeClueEl) activeClueEl.classList.add('active');
      }
    }

    function belongsToActiveWord(r, c) {
      if (currentPuzzle.solution[r][c] === null) return false;

      if (direction === 'across') {
        if (r !== activeRow) return false;
        let startCol = activeCol;
        while (startCol > 0 && currentPuzzle.solution[r][startCol - 1] !== null) startCol--;
        let endCol = activeCol;
        while (endCol < currentPuzzle.size - 1 && currentPuzzle.solution[r][endCol + 1] !== null) endCol++;
        return c >= startCol && c <= endCol;
      } else {
        if (c !== activeCol) return false;
        let startRow = activeRow;
        while (startRow > 0 && currentPuzzle.solution[startRow - 1][c] !== null) startRow--;
        let endRow = activeRow;
        while (endRow < currentPuzzle.size - 1 && currentPuzzle.solution[endRow + 1][c] !== null) endRow++;
        return r >= startRow && r <= endRow;
      }
    }

    function getCurrentClue() {
      const list = currentPuzzle.clues[direction];
      let startR = activeRow, startC = activeCol;
      
      if (direction === 'across') {
        while (startC > 0 && currentPuzzle.solution[startR][startC - 1] !== null) startC--;
      } else {
        while (startR > 0 && currentPuzzle.solution[startR - 1][startC] !== null) startR--;
      }

      return list.find(clue => clue.row === startR && clue.col === startC);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') moveSelection(0, 1);
      else if (e.key === 'ArrowLeft') moveSelection(0, -1);
      else if (e.key === 'ArrowDown') moveSelection(1, 0);
      else if (e.key === 'ArrowUp') moveSelection(-1, 0);
      else if (e.key === 'Backspace') {
        userGrid[activeRow][activeCol] = '';
        checkStates[activeRow][activeCol] = null;
        renderBoardValues();
        moveSelectionPrevious();
      } else if (/^[a-zA-Z]$/.test(e.key)) {
        userGrid[activeRow][activeCol] = e.key.toUpperCase();
        checkStates[activeRow][activeCol] = null; // Clear check state when editing
        renderBoardValues();
        moveSelectionNext();
      }
    });

    function moveSelection(dr, dc) {
      let newR = activeRow + dr;
      let newC = activeCol + dc;

      if (newR >= 0 && newR < currentPuzzle.size && newC >= 0 && newC < currentPuzzle.size) {
        if (currentPuzzle.solution[newR][newC] !== null) {
          activeRow = newR;
          activeCol = newC;
          updateHighlighting();
        }
      }
    }

    function moveSelectionNext() {
      if (direction === 'across') {
        if (activeCol + 1 < currentPuzzle.size && currentPuzzle.solution[activeRow][activeCol + 1] !== null) {
          activeCol++;
        }
      } else {
        if (activeRow + 1 < currentPuzzle.size && currentPuzzle.solution[activeRow + 1][activeCol] !== null) {
          activeRow++;
        }
      }
      updateHighlighting();
    }

    function moveSelectionPrevious() {
      if (direction === 'across') {
        if (activeCol - 1 >= 0 && currentPuzzle.solution[activeRow][activeCol - 1] !== null) {
          activeCol--;
        }
      } else {
        if (activeRow - 1 >= 0 && currentPuzzle.solution[activeRow - 1][activeCol] !== null) {
          activeRow--;
        }
      }
      updateHighlighting();
    }

    function renderBoardValues() {
      for (let r = 0; r < currentPuzzle.size; r++) {
        for (let c = 0; c < currentPuzzle.size; c++) {
          if (currentPuzzle.solution[r][c] !== null) {
            const cell = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"] .letter`);
            if (cell) cell.textContent = userGrid[r][c];
          }
        }
      }
      updateHighlighting();
    }

    // CHECK LOGIC
    function checkCell(r, c) {
      if (currentPuzzle.solution[r][c] === null || userGrid[r][c] === '') return;
      if (userGrid[r][c] === currentPuzzle.solution[r][c]) {
        checkStates[r][c] = 'correct';
      } else {
        checkStates[r][c] = 'incorrect';
      }
    }

    document.getElementById('check-square-btn').addEventListener('click', () => {
      checkCell(activeRow, activeCol);
      updateHighlighting();
    });

    document.getElementById('check-word-btn').addEventListener('click', () => {
      for (let r = 0; r < currentPuzzle.size; r++) {
        for (let c = 0; c < currentPuzzle.size; c++) {
          if (belongsToActiveWord(r, c)) {
            checkCell(r, c);
          }
        }
      }
      updateHighlighting();
    });

    document.getElementById('check-puzzle-btn').addEventListener('click', () => {
      let isFullyCorrect = true;
      for (let r = 0; r < currentPuzzle.size; r++) {
        for (let c = 0; c < currentPuzzle.size; c++) {
          if (currentPuzzle.solution[r][c] !== null) {
            checkCell(r, c);
            if (userGrid[r][c] !== currentPuzzle.solution[r][c]) {
              isFullyCorrect = false;
            }
          }
        }
      }
      updateHighlighting();

      if (isFullyCorrect) {
        clearInterval(timerInterval);
        alert(`Congratulations! You solved "${currentPuzzle.title}" in ${timerElement.textContent}!`);
      }
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      loadPuzzle(currentPuzzle);
    });

    // Initialize App
    initPuzzleSelect();
    loadPuzzle(puzzles[0]);
  </script>
</body>
</html>
