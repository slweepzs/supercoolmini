<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MELS EPIC CROSSWORDS !!</title>

  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
      --primary-color: #4a90e2;
      --highlight-color: #a4c2f4;
      --cell-highlight: #d9e1f2;
      --border-color: #222222;
      --correct-color: #2e7d32;
      --correct-bg: #e8f5e9;
      --wrong-color: #c62828;
      --wrong-bg: #ffebee;
      --grid-size: 5;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 5px 0;
      font-size: 2rem;
    }

    .header-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
    }

    select {
      padding: 6px 12px;
      font-size: 1rem;
      border-radius: 4px;
      border: 1px solid #ccc;
      background-color: white;
      cursor: pointer;
    }

    .timer {
      font-size: 1.2rem;
      font-weight: bold;
      color: #666;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 800px;
      width: 100%;
    }

    @media (min-width: 600px) {
      .main-container {
        flex-direction: row;
        align-items: flex-start;
        justify-content: center;
      }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(var(--grid-size), 50px);
      grid-template-rows: repeat(var(--grid-size), 50px);
      gap: 2px;
      background-color: var(--border-color);
      border: 3px solid var(--border-color);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      border-radius: 4px;
    }

    .cell {
      background-color: white;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      text-transform: uppercase;
      user-select: none;
      cursor: pointer;
    }

    .cell.black {
      background-color: #000 !important;
      cursor: default;
    }

    .cell.highlighted {
      background-color: var(--cell-highlight);
    }

    .cell.active {
      background-color: var(--highlight-color);
    }

    .cell.correct {
      background-color: var(--correct-bg) !important;
      color: var(--correct-color);
    }

    .cell.incorrect {
      background-color: var(--wrong-bg) !important;
      color: var(--wrong-color);
      text-decoration: line-through;
    }

    .cell-number {
      position: absolute;
      top: 2px;
      left: 3px;
      font-size: 0.65rem;
      font-weight: normal;
      color: #555;
    }

    .clues-container {
      display: flex;
      gap: 20px;
      flex: 1;
      width: 100%;
    }

    .clue-column {
      flex: 1;
    }

    .clue-column h3 {
      border-bottom: 2px solid #ccc;
      padding-bottom: 5px;
      margin-top: 0;
    }

    .clue-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .clue-item {
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }

    .clue-item.active {
      background-color: var(--cell-highlight);
      font-weight: bold;
    }

    /* Pure CSS Animated Nyan Banner - Zero External Requests */
    .nyan-banner {
      margin-top: 25px;
      padding: 10px 20px;
      background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3);
      border-radius: 8px;
      color: white;
      font-weight: bold;
      font-size: 1.2rem;
      text-shadow: 1px 1px 2px black;
      animation: rainbow 2s linear infinite;
    }

    @keyframes rainbow {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    .controls {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    button {
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      background-color: var(--primary-color);
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #357abd;
    }

    .btn-hint {
      background-color: #f39c12;
    }

    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      bottom: 100%;
      left: 0;
      background-color: white;
      min-width: 140px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      border-radius: 4px;
      z-index: 10;
    }

    .dropdown-content.show {
      display: block;
    }

    .dropdown-content button {
      color: #333;
      padding: 10px 14px;
      display: block;
      width: 100%;
      text-align: left;
      background-color: white;
      border-bottom: 1px solid #eee;
    }
  </style>
</head>
<body>

  <header>
    <h1>MELS EPIC CROSSWORDS !!</h1>
    <div class="header-controls">
      <select id="puzzle-select"></select>
      <div class="timer" id="timer">00:00</div>
    </div>
  </header>

  <div class="main-container">
    <div class="grid" id="grid"></div>

    <div class="clues-container">
      <div class="clue-column">
        <h3>ACROSS</h3>
        <ul class="clue-list" id="across-clues"></ul>
      </div>
      <div class="clue-column">
        <h3>DOWN</h3>
        <ul class="clue-list" id="down-clues"></ul>
      </div>
    </div>
  </div>

  <div class="nyan-banner">🐱🌈 NYAN CAT POWER ACTIVE! 🌈🐱</div>

  <div class="controls">
    <button id="hint-btn" class="btn-hint">💡 Hint</button>

    <div class="dropdown">
      <button id="check-menu-btn">Check ▼</button>
      <div class="dropdown-content" id="check-dropdown">
        <button id="check-square-btn">Check Square</button>
        <button id="check-word-btn">Check Word</button>
        <button id="check-puzzle-btn">Check Puzzle</button>
      </div>
    </div>

    <div class="dropdown">
      <button id="reveal-menu-btn">Reveal ▼</button>
      <div class="dropdown-content" id="reveal-dropdown">
        <button id="reveal-square-btn">Reveal Square</button>
        <button id="reveal-word-btn">Reveal Word</button>
        <button id="reveal-puzzle-btn">Reveal Puzzle</button>
      </div>
    </div>

    <button id="reset-btn">Reset</button>
  </div>

  <script>
    const puzzles = [
      {
        id: "p1",
        title: "Level 1: Animal Kingdom",
        size: 5,
        solution: [
          ['C', 'A', 'T', 'S', null],
          ['A', 'L', 'O', 'E', 'S'],
          ['P', 'I', 'A', 'N', 'O'],
          ['E', 'O', 'S', 'I', 'N'],
          [null, 'N', 'T', 'O', 'P']
        ],
        clues: {
          across: [
            { number: 1, row: 0, col: 0, text: "Feline pets" },
            { number: 5, row: 1, col: 0, text: "Soothing succulents" },
            { number: 6, row: 2, col: 0, text: "Grand instrument" },
            { number: 7, row: 3, col: 0, text: "Red dye used in biology" },
            { number: 8, row: 4, col: 1, text: "On ___ of (in addition to)" }
          ],
          down: [
            { number: 1, row: 0, col: 0, text: "Superhero accessory" },
            { number: 2, row: 0, col: 1, text: "Alias indicator" },
            { number: 3, row: 0, col: 2, text: "Toast topping" },
            { number: 4, row: 0, col: 3, text: "Senorita's title (abbr.)" },
            { number: 5, row: 1, col: 4, text: "Son of Isaac in Genesis" }
          ]
        }
      }
    ];

    let currentPuzzle = puzzles[0];
    let activeRow = 0;
    let activeCol = 0;
    let direction = 'across';
    let userGrid = Array(5).fill(null).map(() => Array(5).fill(''));
    let checkStates = Array(5).fill(null).map(() => Array(5).fill(null));

    const gridElement = document.getElementById('grid');
    const acrossCluesElement = document.getElementById('across-clues');
    const downCluesElement = document.getElementById('down-clues');

    function createBoard() {
      gridElement.innerHTML = '';
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 5; c++) {
          const cellDiv = document.createElement('div');
          cellDiv.classList.add('cell');
          cellDiv.dataset.row = r;
          cellDiv.dataset.col = c;

          if (currentPuzzle.solution[r][c] === null) {
            cellDiv.classList.add('black');
          } else {
            const letterSpan = document.createElement('span');
            letterSpan.classList.add('letter');
            cellDiv.appendChild(letterSpan);
            cellDiv.addEventListener('click', () => {
              activeRow = r;
              activeCol = c;
              updateHighlighting();
            });
          }
          gridElement.appendChild(cellDiv);
        }
      }
      renderClues();
      updateHighlighting();
    }

    function renderClues() {
      acrossCluesElement.innerHTML = currentPuzzle.clues.across.map(c => `<li><b>${c.number}.</b> ${c.text}</li>`).join('');
      downCluesElement.innerHTML = currentPuzzle.clues.down.map(c => `<li><b>${c.number}.</b> ${c.text}</li>`).join('');
    }

    function updateHighlighting() {
      document.querySelectorAll('.cell').forEach(cell => {
        const r = parseInt(cell.dataset.row);
        const c = parseInt(cell.dataset.col);
        cell.classList.remove('active', 'highlighted');
        if (r === activeRow && c === activeCol) cell.classList.add('active');
      });
    }

    document.addEventListener('keydown', (e) => {
      if (/^[a-zA-Z]$/.test(e.key)) {
        userGrid[activeRow][activeCol] = e.key.toUpperCase();
        renderValues();
      } else if (e.key === 'Backspace') {
        userGrid[activeRow][activeCol] = '';
        renderValues();
      }
    });

    function renderValues() {
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 5; c++) {
          if (currentPuzzle.solution[r][c] !== null) {
            const el = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"] .letter`);
            if (el) el.textContent = userGrid[r][c];
          }
        }
      }
    }

    createBoard();
  </script>
</body>
</html>
